<li class="relative w-44 pl-11 md:w-56 md:pl-14 lg:w-60">
  <span aria-hidden="true" class="rank-number absolute bottom-7 left-0 text-[5.5rem] font-bold leading-none md:text-[7.5rem]">{{ rank }}</span>
  <a href="{{ movie.get_absolute_url }}" aria-label="Hạng {{ rank }}: {{ movie.title }}" class="group relative block rounded-card focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand">
    <div class="skeleton relative aspect-[2/3] overflow-hidden rounded-card">
      {% include "includes/card_poster.html" with movie=movie only %}
    </div>
    <h3 class="mt-2 line-clamp-1 text-sm font-medium leading-snug">{{ movie.title }}</h3>
  </a>
</li>
