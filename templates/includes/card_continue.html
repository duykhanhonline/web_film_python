{% load catalog_tags %}{% with movie=progress.movie %}
<li class="w-60 md:w-72 lg:w-80">
  <a href="{{ progress.watch_url }}" class="group block rounded-card focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand">
    <div class="skeleton relative aspect-video overflow-hidden rounded-card">
      <img src="{{ movie.backdrop|rendition:640 }}" srcset="{{ movie.backdrop|srcset:'backdrop' }}" sizes="(min-width: 1024px) 320px, (min-width: 768px) 288px, 240px" alt="Ảnh nền phim {{ movie.title }}" loading="lazy" decoding="async" width="640" height="360" class="size-full object-cover transition-transform duration-300 motion-safe:pointer-fine:group-hover:scale-105">
      {% if movie.is_vip %}
      <span class="badge badge-vip absolute left-1.5 top-1.5">VIP</span>
      {% else %}
      <span class="badge badge-free absolute left-1.5 top-1.5">Miễn phí</span>
      {% endif %}
      <div class="absolute inset-x-0 bottom-0 h-1 bg-surface-2/80">
        <div class="h-full bg-brand" style="width: {{ progress.percent }}%"></div>
      </div>
    </div>
    <h3 class="mt-2 line-clamp-1 text-sm font-medium leading-snug">{{ movie.title }}</h3>
    <p class="text-xs leading-snug text-muted">{% if movie.is_series %}Tập {{ progress.episode.number }} · {% endif %}{{ progress.remaining_seconds|remaining }}</p>
  </a>
</li>
{% endwith %}
