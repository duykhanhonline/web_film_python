<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhimHay - Xem phim bộ, phim lẻ Vietsub, Thuyết minh</title>
  <meta name="description" content="Xem phim bộ, phim lẻ Hàn Quốc, Trung Quốc, Việt Nam với Vietsub và Thuyết minh.">
  <meta name="theme-color" content="#0B0B0F">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://placehold.co">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="dist/output.css">
  <script type="module" src="js/home.js"></script>
</head>
<body data-user="free" data-header="overlay" class="bg-bg font-sans text-text antialiased">
  <div data-include="header"></div>

  <main>
    <h1 class="sr-only">PhimHay - Xem phim bộ, phim lẻ trực tuyến</h1>

    <section data-carousel aria-roledescription="carousel" aria-label="Phim nổi bật" class="relative">
      <div data-carousel-track class="skeleton relative aspect-[3/4] max-h-[85svh] w-full touch-pan-y overflow-hidden md:aspect-video md:max-h-[80svh] lg:aspect-[21/9]"></div>

      <button type="button" data-carousel-prev aria-label="Slide trước" class="absolute left-4 top-1/2 hidden size-11 -translate-y-1/2 items-center justify-center rounded-full bg-bg/50 backdrop-blur hover:bg-bg/80 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand lg:flex">
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button type="button" data-carousel-next aria-label="Slide tiếp theo" class="absolute right-4 top-1/2 hidden size-11 -translate-y-1/2 items-center justify-center rounded-full bg-bg/50 backdrop-blur hover:bg-bg/80 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand lg:flex">
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <div class="absolute bottom-1 right-2 flex items-center md:bottom-3 md:right-6 lg:right-10">
        <div data-carousel-dots class="flex items-center"></div>
        <button type="button" data-carousel-toggle aria-pressed="false" aria-label="Tạm dừng tự chuyển" class="group flex size-11 items-center justify-center rounded-full text-text/80 hover:text-text focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand">
          <svg class="size-4 group-aria-pressed:hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
          <svg class="hidden size-4 group-aria-pressed:block" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
        </button>
      </div>
    </section>

    <div class="mt-6 px-4 md:px-8 lg:px-12">
      <aside class="ad-slot" data-slot="ad-billboard"></aside>
    </div>

    <div data-home="continue"></div>
    <div data-home="top10"></div>
    <div data-movie-row data-title="Phim bộ mới cập nhật" data-type="bo" data-sort="new" data-see-all="phim-bo.html"></div>

    <div class="mt-10 px-4 md:px-8 lg:px-12">
      <aside class="ad-slot" data-slot="ad-infeed"></aside>
    </div>

    <div data-movie-row data-title="Phim Hàn Quốc" data-country="Hàn Quốc" data-see-all="tim-kiem.html?quoc-gia=han-quoc"></div>
    <div data-movie-row data-title="Phim Trung Quốc" data-country="Trung Quốc" data-see-all="tim-kiem.html?quoc-gia=trung-quoc"></div>
    <div data-movie-row data-title="Phim Việt chiếu rạp" data-country="Việt Nam" data-type="le" data-see-all="tim-kiem.html?quoc-gia=viet-nam&amp;loai=phim-le"></div>

    <div class="mt-10 px-4 md:px-8 lg:px-12">
      <aside class="ad-slot" data-slot="ad-infeed"></aside>
    </div>

    <div data-movie-row data-title="Anime" data-genre="Hoạt hình" data-see-all="tim-kiem.html?the-loai=hoat-hinh"></div>
    <div data-home="sponsored" data-ad></div>
  </main>

  <div data-include="footer"></div>
  <div data-include="bottom-nav"></div>

  <template id="tpl-hero-slide">
    <div data-slide role="group" aria-roledescription="slide" class="absolute inset-0 opacity-0 transition-opacity duration-700 data-[active]:opacity-100 motion-reduce:transition-none">
      <picture>
        <source data-field="source-lg" media="(min-width: 1024px)" width="1920" height="823">
        <source data-field="source-md" media="(min-width: 768px)" width="1280" height="720">
        <img data-field="backdrop" loading="lazy" decoding="async" width="720" height="960" class="size-full object-cover">
      </picture>
      <div class="absolute inset-0 bg-gradient-to-t from-bg via-bg/40 to-bg/10"></div>
      <div class="absolute inset-0 hidden bg-gradient-to-r from-bg/80 via-bg/20 to-transparent md:block"></div>
      <div class="absolute inset-x-0 bottom-0 px-4 pb-14 md:px-8 md:pb-16 lg:px-12 lg:pb-20">
        <div class="max-w-xl">
          <p data-field="sponsor" hidden class="mb-2 text-xs font-medium leading-snug text-muted"></p>
          <h2 data-field="title" class="text-3xl font-bold leading-snug md:text-5xl md:leading-snug"></h2>
          <p data-field="original" class="text-sm leading-snug text-muted"></p>
          <div data-field="badges" class="mt-3 flex flex-wrap items-center gap-x-3 gap-y-1.5 text-xs leading-snug md:text-sm"></div>
          <p data-field="synopsis" class="mt-3 line-clamp-2 text-sm leading-relaxed text-text/90 md:text-base"></p>
          <div class="mt-5 flex flex-wrap gap-3">
            <a data-field="cta" class="btn btn-primary">
              <svg class="size-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
              <span data-field="cta-label">Xem ngay</span>
            </a>
            <button type="button" data-field="mylist" aria-pressed="false" class="group btn btn-outline bg-bg/40 backdrop-blur">
              <svg class="size-5 group-aria-pressed:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              <svg class="hidden size-5 group-aria-pressed:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
              <span data-mylist-label>Danh sách</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>
</body>
</html>
