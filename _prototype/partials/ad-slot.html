  <span class="pointer-events-none absolute left-2 top-1 text-[10px] leading-snug text-muted">Quảng cáo</span>
  <a href="vip.html" class="absolute right-0 top-0 flex min-h-11 items-start px-2 pt-1 text-[10px] leading-snug text-muted underline hover:text-text focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand">Ẩn quảng cáo</a>
